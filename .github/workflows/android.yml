name: Build Fluid Home APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fluid-home-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out this revision
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up pinned Gradle (no wrapper JAR needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reuse the debug key when available
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fluid-home-debug-keystore-v1
      - name: Compile, test, lint, and build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            -PbuildNumber="$BUILD_NUMBER" -PcommitSha="$(git rev-parse HEAD)"
      - name: Record source identity
        run: python3 scripts/build_info.py
      - name: Upload APK and build identity
        uses: actions/upload-artifact@v4
        with:
          name: fluid-home-debug-${{ github.run_number }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-home-reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
